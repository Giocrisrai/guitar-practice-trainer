[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-musica"
version = "0.1.0"
description = "Software libre para practicar guitarra con el cable Rocksmith"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "sounddevice>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyguitarpro>=0.11",
    "mido>=1.3",
    "music21>=10.5",
    "python-multipart>=0.0.20",
]

[project.scripts]
guitarra = "servidor.arranque:main"

[dependency-groups]
dev = ["pytest>=8.0", "soundfile>=0.12", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["nucleo*", "servidor*", "herramientas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Las pruebas que pagan tiempo de RELOJ DE PARED porque es justo el reloj de pared
# lo que verifican: la sesion completa del gemelo digital mete su audio por el
# dispositivo simulado y lo recorre a tiempo real, segundo por segundo.
#
# NO van desactivadas por omision, y es una decision: una prueba lenta que nadie
# corre no vigila nada, y estas son las unicas que ejercitan los hilos, el buffer
# circular y el reloj de pared de la pasada. Lo que se acota es su coste, no su
# ejecucion: son dos, comparten una sola pasada y la pieza dura tres segundos.
# Para saltarlas a mano: `-m "not slow"`.
markers = [
    "slow: paga segundos de reloj de pared porque es el reloj lo que verifica",
]
