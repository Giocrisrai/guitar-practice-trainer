[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-musica"
version = "0.1.0"
description = "Software libre para practicar guitarra con el cable Rocksmith"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "sounddevice>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
guitarra = "servidor.arranque:main"

[dependency-groups]
dev = ["pytest>=8.0", "soundfile>=0.12", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["nucleo*", "servidor*", "herramientas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
